[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "surface-conductivity"
version = "0.1.0"
description = "Fermart lab multimeter acquisition and programmable power supply control"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["fastapi==0.116.1", "uvicorn[standard]==0.35.0", "pyserial==3.5", "pyvisa==1.14.1", "pyvisa-py==0.7.2", "pyusb==1.2.1", "python-dotenv==1.1.1", "openpyxl==3.1.5"]

[project.optional-dependencies]
dev = ["pytest>=8,<9"]
legacy = ["dash>=2.17,<3", "plotly>=5.22,<6"]

[tool.setuptools.packages.find]
where = ["src"]
include = ["surface_conductivity_monitor*"]

[tool.setuptools.package-data]
surface_conductivity_monitor = ["static/*", "templates/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "src"]
